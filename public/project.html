<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · Paydirt</title>
<link rel="icon" href="brand/simple.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
<script>try { const t = localStorage.getItem('paydirt.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }</script>
</head>
<body class="page">
<nav class="sidenav" aria-label="Main">
  <a href="index.html" class="wordmark" title="Your projects">Pay<span>dirt</span></a>
  <div class="navLinks"><a href="index.html">Projects</a><a href="map.html" id="navMap">Map</a><a href="project.html" id="navSaved" aria-current="page">Saved</a><a href="areas.html">Areas</a></div>
  <div class="navFoot">
    <button type="button" id="feedbackBtn" class="feedbackBtn">Feedback</button>
    <span id="orgName" class="lblish"></span>
    <div class="themeSwitch" role="group" aria-label="Theme"><button type="button" data-theme-set="system" aria-pressed="true">Auto</button><button type="button" data-theme-set="light" aria-pressed="false">Light</button><button type="button" data-theme-set="dark" aria-pressed="false">Dark</button></div>
    <div id="userButton"></div>
  </div>
</nav>

<main class="page-in">
  <section class="hero field">
    <div class="heroMain">
      <p class="lbl">Project</p>
      <h1 id="pName" class="title">&nbsp;</h1>
      <p id="pBrief" class="brief" data-taper="3"></p>
      <p id="pMeta" class="lblish"></p>
    </div>
    <div class="heroSide">
      <div class="keyNum"><span class="big" id="heroSaved">–</span><span class="lbl">properties saved</span></div>
      <a id="openMap" class="btn" href="map.html">Open map</a>
    </div>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="title"><i class="tilt" aria-hidden="true"></i>saved</h2><span class="btnRow"><span id="savedCount" class="lblish"></span><a id="compareBtn" class="btn paper" href="fit.html">Compare fit</a></span></div>
    <div id="statusFilter" class="statusFilter" role="group" aria-label="Show status"></div>
    <div id="saved"><p class="muted">Loading…</p></div>
    <p id="msg" class="msg"></p>
  </section>
</main>

<div id="signin" hidden><div class="signinCard"><h1>Pay<span style="color:var(--accent)">dirt</span></h1><p class="sub">Sign in to continue. Access is by invitation.</p><div id="signinBox"></div></div></div>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="feedback.js"></script>
<script src="score.js"></script>
<script src="taper.js"></script>
<script src="pages.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="property.js"></script>
<script src="criteria.js"></script>
<script>
(async () => {
  const { $, esc, api, where, siteTitle, ac, date, labels, STATUSES, STATUS_TEXT } = pd;
  const id = Number(new URLSearchParams(location.search).get('id'));
  // Status filter over the rows already loaded: All, then each status.
  let rows = [], show = 'all';
  const FILTERS = [['all', 'All'], ...STATUSES.map((s) => [s, STATUS_TEXT[s]])];
  function paintFilter() {
    $('statusFilter').innerHTML = FILTERS.map(([v, t]) => {
      const n = v === 'all' ? rows.length : rows.filter((p) => p.status === v).length;
      return `<button type="button" data-show="${v}" aria-pressed="${show === v}">${esc(t)} <span class="lblish">${n}</span></button>`;
    }).join('');
  }
  $('statusFilter').addEventListener('click', (e) => {
    const b = e.target.closest('[data-show]'); if (!b) return;
    show = b.dataset.show; paint();
  });
  async function load() {
    const r = await api(`/api/projects/${id}/saved`);
    rows = r.saved;
    document.title = `${r.project.name} · Paydirt`;
    $('pName').textContent = r.project.name;
    $('pBrief').textContent = r.project.brief || '';
    $('pMeta').textContent = `Version ${r.project.spec_version} · ${r.project.project_uid}`;
    $('openMap').href = `map.html?project=${r.project.id}`;
    $('compareBtn').href = `fit.html?project=${r.project.id}`;
    $('savedCount').textContent = `${r.saved.length} properties`; $('heroSaved').textContent = r.saved.length;
    paint();
  }
  function paint() {
    paintFilter();
    const list = show === 'all' ? rows : rows.filter((p) => p.status === show);
    $('saved').innerHTML = list.length ? `<div class="table-wrap"><table class="grid">
      <thead><tr><th>Score</th><th>Property</th><th>Status</th><th>Notes</th><th>Saved</th><th></th></tr></thead>
      <tbody>${list.map((p) => `<tr data-pin="${esc(p.pin)}">
        <td>${p.score != null ? paydirtScore.chip(p.score) : '<span class="muted small">Hidden</span>'}</td>
        <td><button type="button" class="linkBtn titleBtn" data-view>${esc(siteTitle(p))}</button><div class="muted small">${ac(p.acres)} · ${esc(p.zoning || 'No zone')} · ${esc(where(p))}</div><div class="facts">${labels(p)}</div>
          ${p.hiddenByCriteria ? '<div class="muted small">No longer fits this project’s criteria.</div>' : ''}</td>
        <td><select data-status aria-label="Status">${STATUSES.map((s) => `<option value="${s}" ${p.status === s ? 'selected' : ''}>${STATUS_TEXT[s]}</option>`).join('')}</select></td>
        <td><textarea data-notes rows="2" placeholder="Site visit, owner contact…">${esc(p.notes)}</textarea></td>
        <td class="nowrap">${date(p.saved_at)}</td>
        <td class="nowrap"><a href="fit.html?project=${id}&pin=${encodeURIComponent(p.pin)}">Fit</a> · <a href="map.html?project=${id}&pin=${encodeURIComponent(p.pin)}">Map</a> · <button type="button" class="linkBtn" data-unsave>Remove</button></td>
      </tr>`).join('')}</tbody></table></div>`
      : rows.length ? `<div class="empty"><b>No ${esc(STATUS_TEXT[show])} properties</b><p class="muted">Pick All to see every saved property.</p></div>`
      : `<div class="empty"><b>Nothing saved to this project yet</b><p class="muted">Open the map and tap ☆ on a parcel.</p></div>`;
    window.paydirtTaper?.apply(document);
  }
  const say = (t, err) => { $('msg').className = err ? 'msg err' : 'msg'; $('msg').textContent = t; };
  $('saved').addEventListener('change', async (e) => {
    const row = e.target.closest('tr[data-pin]'); if (!row || !e.target.matches('[data-status]')) return;
    try {
      await api(`/api/projects/${id}/reviews/${encodeURIComponent(row.dataset.pin)}`, { method: 'PATCH', body: { status: e.target.value } }); say('Status saved.');
      const p = rows.find((x) => x.pin === row.dataset.pin); if (p) p.status = e.target.value;
      paintFilter(); // counts follow; the row stays put until the filter changes
    }
    catch (err) { say(err.message, true); }
  });
  $('saved').addEventListener('focusout', async (e) => {
    const row = e.target.closest('tr[data-pin]'); if (!row || !e.target.matches('[data-notes]') || e.target.value === e.target.defaultValue) return;
    try { await api(`/api/projects/${id}/reviews/${encodeURIComponent(row.dataset.pin)}`, { method: 'PATCH', body: { notes: e.target.value } }); e.target.defaultValue = e.target.value; say('Notes saved.'); }
    catch (err) { say(err.message, true); }
  });
  document.addEventListener('paydirt:changed', () => load().catch(() => {}));
  $('saved').addEventListener('click', async (e) => {
    const v = e.target.closest('[data-view]');
    if (v) return paydirtProperty.open(id, v.closest('tr[data-pin]').dataset.pin);
    const b = e.target.closest('[data-unsave]'); if (!b) return;
    const row = b.closest('tr[data-pin]');
    try { await api(`/api/projects/${id}/saved/${encodeURIComponent(row.dataset.pin)}`, { method: 'PUT', body: { saved: false } }); say('Removed from saved. Its notes are kept if you save it again.'); await load(); }
    catch (err) { say(err.message, true); }
  });
  try { await load(); } catch (e) { $('saved').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
