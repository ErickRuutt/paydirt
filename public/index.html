<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paydirt</title>
<link rel="icon" href="brand/simple.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>/* Apply the saved theme before first paint to avoid a flash. */ try { const t = localStorage.getItem('paydirt.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }</script>
</head>
<body class="page">
<header class="topbar">
  <div class="topbar-in">
    <a href="index.html" class="wordmark">Pay<span>dirt</span></a>
    <span id="orgName" class="lblish"></span>
    <div class="brand-right">
      <div class="themeSwitch" role="group" aria-label="Theme"><button type="button" data-theme-set="system" aria-pressed="true">Auto</button><button type="button" data-theme-set="light" aria-pressed="false">Light</button><button type="button" data-theme-set="dark" aria-pressed="false">Dark</button></div>
      <div id="userButton"></div>
    </div>
  </div>
</header>

<main class="page-in">
  <section class="block">
    <div class="block-head"><h2>Projects</h2><span id="projCount" class="lblish"></span></div>
    <div id="projects" class="cards"><p class="muted">Loading…</p></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>Saved properties</h2><span id="savedCount" class="lblish"></span></div>
    <p class="muted" style="margin:0 0 12px;font-size:13px">Every property saved to any of your projects, newest first. Save one with the ☆ on the map.</p>
    <div id="saved"><p class="muted">Loading…</p></div>
  </section>
</main>

<div id="signin" hidden><div class="signinCard"><h1>Pay<span style="color:var(--accent)">dirt</span></h1><p class="sub">Sign in to continue. Access is by invitation.</p><div id="signinBox"></div></div></div>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="pages.js"></script>
<script>
(async () => {
  const { $, esc, api, where, siteTitle, ac, date, labels, STATUS_TEXT } = pd;
  try {
    const h = await api('/api/home');
    $('orgName').textContent = h.org?.name ?? '';
    $('projCount').textContent = `${h.projects.length} active`;
    $('projects').innerHTML = h.projects.map((p) => `
      <article class="card">
        <div class="card-top"><h3>${esc(p.name)}</h3><span class="lblish">v${p.spec_version}</span></div>
        <p class="muted brief" data-taper="3">${esc(p.brief || 'No brief yet.')}</p>
        <dl class="stats"><div><dt>Saved</dt><dd>${p.saved}</dd></div><div><dt>Shortlist</dt><dd>${p.shortlisted}</dd></div><div><dt>Criteria</dt><dd>${p.criteria}</dd></div><div><dt>Updated</dt><dd>${date(p.last_activity ?? p.updated_at)}</dd></div></dl>
        <div class="btnRow"><a class="btn" href="map.html?project=${p.id}">Open map</a><a class="btn secondary" href="project.html?id=${p.id}">Saved properties</a></div>
      </article>`).join('') + `
      <article class="card start">
        <h3>Start a project</h3>
        <p class="muted">Describe what you're looking for and Paydirt ranks every parcel against it.</p>
        <div class="startBtns">
          <a class="btn secondary" href="map.html?new=brief">From a brief<small>Paste notes or upload a file</small></a>
          <a class="btn secondary" href="map.html?new=interview">By interview<small>Answer a few questions</small></a>
          <a class="btn secondary" href="map.html?new=form">Blank criteria<small>Set it up yourself</small></a>
        </div>
      </article>`;
    $('savedCount').textContent = `${h.saved.length}`;
    $('saved').innerHTML = h.saved.length ? `<div class="table-wrap"><table class="grid">
      <thead><tr><th>Property</th><th>Project</th><th>Status</th><th>Saved</th><th></th></tr></thead>
      <tbody>${h.saved.map((r) => `<tr>
        <td><b>${esc(siteTitle(r))}</b><div class="muted small">${ac(r.acres)} · ${esc(r.zoning || 'No zone')} · ${esc(where(r))}</div><div class="facts">${labels(r)}</div></td>
        <td>${esc(r.project_name)}</td>
        <td><span class="pill ${r.status}">${esc(STATUS_TEXT[r.status] ?? r.status)}</span></td>
        <td class="nowrap">${date(r.saved_at)}</td>
        <td class="nowrap"><a href="map.html?project=${r.project_id}&pin=${encodeURIComponent(r.pin)}">Open on map</a></td>
      </tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><b>Nothing saved yet</b><p class="muted">Open a project's map and tap ☆ on any parcel to keep it here.</p></div>`;
    window.paydirtTaper?.apply(document);
  } catch (e) { $('projects').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; $('saved').innerHTML = ''; }
})();
</script>
<script src="taper.js"></script>
</body>
</html>
